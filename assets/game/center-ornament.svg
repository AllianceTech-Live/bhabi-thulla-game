<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Art Deco center ornament  emerald/gold language -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D58A"/>
      <stop offset="45%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8C641E"/>
    </linearGradient>
  </defs>

  <!-- Outer diamond -->
  <path d="M100 18 L182 100 L100 182 L18 100 Z" stroke="url(#gold)" stroke-width="1.4" opacity="0.95"/>
  <!-- Mid diamond -->
  <path d="M100 38 L162 100 L100 162 L38 100 Z" stroke="url(#gold)" stroke-width="1.1" opacity="0.85"/>
  <!-- Inner diamond -->
  <path d="M100 58 L142 100 L100 142 L58 100 Z" stroke="url(#gold)" stroke-width="1" opacity="0.8"/>
  <!-- Core diamond -->
  <path d="M100 78 L122 100 L100 122 L78 100 Z" stroke="url(#gold)" stroke-width="1.2"/>

  <!-- Cross axes -->
  <line x1="100" y1="28" x2="100" y2="172" stroke="url(#gold)" stroke-width="1"/>
  <line x1="28" y1="100" x2="172" y2="100" stroke="url(#gold)" stroke-width="1"/>

  <!-- Diagonal rays -->
  <line x1="48" y1="48" x2="152" y2="152" stroke="#C89B3C" stroke-width="0.7" opacity="0.65"/>
  <line x1="152" y1="48" x2="48" y2="152" stroke="#C89B3C" stroke-width="0.7" opacity="0.65"/>

  <!-- Fan ticks N -->
  <line x1="100" y1="52" x2="88" y2="36" stroke="url(#gold)" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="100" y1="52" x2="100" y2="32" stroke="url(#gold)" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="100" y1="52" x2="112" y2="36" stroke="url(#gold)" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Fan ticks S -->
  <line x1="100" y1="148" x2="88" y2="164" stroke="url(#gold)" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="100" y1="148" x2="100" y2="168" stroke="url(#gold)" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="100" y1="148" x2="112" y2="164" stroke="url(#gold)" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Apex diamonds -->
  <path d="M100 12 L105 18 L100 24 L95 18 Z" fill="#C89B3C" opacity="0.9"/>
  <path d="M100 176 L105 182 L100 188 L95 182 Z" fill="#C89B3C" opacity="0.9"/>
  <path d="M12 100 L18 95 L24 100 L18 105 Z" fill="#C89B3C" opacity="0.75"/>
  <path d="M176 100 L182 95 L188 100 L182 105 Z" fill="#C89B3C" opacity="0.75"/>
</svg>
