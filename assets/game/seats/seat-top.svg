<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" fill="none">
  <!-- Top seat headboard + circular frame -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6AF55" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F0D58A"/>
      <stop offset="100%" stop-color="#D6AF55" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D58A"/>
      <stop offset="100%" stop-color="#8C641E"/>
    </linearGradient>
  </defs>
  <!-- Stepped Deco headboard -->
  <path d="M30 18 H130" stroke="url(#g)" stroke-width="2"/>
  <path d="M40 12 H120" stroke="url(#g)" stroke-width="1.2" opacity="0.7"/>
  <path d="M50 8 H110" stroke="#A87924" stroke-width="1" opacity="0.5"/>
  <path d="M70 4 L80 10 L90 4" stroke="#D6AF55" stroke-width="1.2" fill="none"/>
  <!-- Avatar ring -->
  <circle cx="80" cy="52" r="28" stroke="url(#ring)" stroke-width="3" fill="#0B0B0B"/>
  <circle cx="80" cy="52" r="24" stroke="#A87924" stroke-width="1"/>
</svg>
